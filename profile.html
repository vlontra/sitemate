<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2e335b" />
    <title>Perfil profissional | GroundWorks Directory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="assets/images/groundworks-favicon.svg" />
    <link rel="stylesheet" href="directory.css" />
  </head>
  <body data-page="profile">
    <header class="site-header site-header-solid" data-header>
      <div class="container nav-shell">
        <a class="brand" href="./" aria-label="GroundWorks Directory">
          <img class="brand-logo-image" src="assets/images/groundworks-logo-white-v7.svg" alt="" width="246" height="48" />
        </a>
        <div class="profile-nav-actions">
          <a class="back-link" href="./"><span aria-hidden="true">←</span> <span data-i18n="profile.back">Voltar ao diretório</span></a>
          <button class="language-button" type="button" data-language aria-label="Mudar idioma para inglês">EN</button>
        </div>
      </div>
    </header>

    <main class="profile-main">
      <div class="container" data-profile-root>
        <div class="profile-loading" data-profile-loading data-i18n="profile.loading">Carregando perfil…</div>
      </div>
    </main>

    <footer class="site-footer compact-footer">
      <div class="container footer-meta">
        <span>© <span data-current-year></span> GroundWorks</span>
        <span data-i18n="footer.note">Perfis em fase de confirmação.</span>
      </div>
    </footer>

    <div class="toast" role="status" aria-live="polite" data-toast></div>
    <script src="data/config.js"></script>
    <script src="directory.js"></script>
  </body>
</html>
